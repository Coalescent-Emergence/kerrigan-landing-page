<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded container with deep space background -->
  <rect width="32" height="32" rx="7" fill="url(#bg-gradient)"/>
  
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13111C" />
      <stop offset="100%" stop-color="#1F1E2E" />
    </linearGradient>
    
    <!-- ECG path gradient -->
    <linearGradient id="ecg-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20be3b" />   <!-- Acid Neon -->
      <stop offset="100%" stop-color="#1a5fb4" />  <!-- High-impact Cyan -->
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background trace (wider stroke, lower opacity) -->
  <path d="M0,16 L6,16 Q8,12 10,16 L11.5,16 L12.5,19.5 L14.5,2.5 L16.5,29.5 L18,16 L19.5,16 Q22.5,11.5 25,16 L32,16" 
        fill="none" 
        stroke="url(#ecg-gradient)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.4"
        filter="url(#glow)"/>

  <!-- Sharp foreground trace (thinner stroke, full opacity) -->
  <path d="M0,16 L6,16 Q8,12 10,16 L11.5,16 L12.5,19.5 L14.5,2.5 L16.5,29.5 L18,16 L19.5,16 Q22.5,11.5 25,16 L32,16" 
        fill="none" 
        stroke="url(#ecg-gradient)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
