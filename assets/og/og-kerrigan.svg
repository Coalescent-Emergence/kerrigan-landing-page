<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link-preview card, 1200x630. Colours and type from design-system.css.
       Text only, no product screenshot, no session content.
       Render: rsvg-convert -w 1200 -h 630 assets/og/og-kerrigan.svg -o static/img/og-kerrigan.png
       (needs Space Grotesk and Space Mono installed). -->
  <defs>
    <linearGradient id="ecg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect x="24" y="24" width="1152" height="582" fill="#0d0d10" stroke="#27272a" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="6" fill="url(#rule)"/>

  <!-- wordmark -->
  <g transform="translate(80,84)">
    <rect width="64" height="64" fill="#121215" stroke="#27272a" stroke-width="2"/>
    <g transform="translate(8,8) scale(1.5)">
      <path d="M0,16 L6,16 Q8,12 10,16 L11.5,16 L12.5,19.5 L14.5,2.5 L16.5,29.5 L18,16 L19.5,16 Q22.5,11.5 25,16 L32,16" fill="none" stroke="url(#ecg)" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>
    <text x="86" y="46" font-family="Space Grotesk" font-weight="700" font-size="44" fill="#ffffff" letter-spacing="-0.5">Kerrigan<tspan font-size="20" dy="-18" fill="#a1a1aa">™</tspan></text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="232" font-family="Space Mono" font-weight="700" font-size="22" fill="#00e5ff" letter-spacing="2">AI CLINICAL NOTES · BEHAVIORAL HEALTH &amp; SUD TREATMENT</text>

  <!-- hero line: claims table, self-hosted transcription row -->
  <text font-family="Space Grotesk" font-weight="700" font-size="66" fill="#ffffff" letter-spacing="-1.5">
    <tspan x="80" y="318">Your client's voice is transcribed</tspan>
    <tspan x="80" y="396">on our own GPUs.</tspan>
  </text>
  <text x="80" y="456" font-family="Space Grotesk" font-weight="400" font-size="32" fill="#d4d4d8">It never reaches a third-party transcription API.</text>

  <!-- footer -->
  <line x1="80" y1="514" x2="1120" y2="514" stroke="#27272a" stroke-width="2"/>
  <text x="80" y="560" font-family="Space Mono" font-weight="400" font-size="24" fill="#d4d4d8">Built for 42 CFR Part 2 workflows</text>
  <text x="1120" y="560" text-anchor="end" font-family="Space Mono" font-weight="700" font-size="24" fill="#00e5ff">latentworx.com</text>
</svg>
