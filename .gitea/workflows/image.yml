# Builds the dev preview image (deploy/Dockerfile, default BASEURL) on every
# push and pushes it to GHCR tagged by short commit sha, like the other
# Kerrigan forge repos (pattern: LatentWorx-Kerrigan/em-react-rlm gitea-image.yml).
# Secrets (org or repo): GHCR_USER, GHCR_TOKEN. The token must write
# Coalescent-Emergence packages.
# Gitea ignores .github/workflows while this directory exists; production
# deploy stays in .github/workflows/deploy.yml (GitHub, via the mirror).
name: image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/coalescent-emergence/kerrigan-landing

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute tag
        id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # provenance off so the pushed object is a plain image manifest.
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Record tag and digest
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "no digest from push" >&2; exit 1; }
          echo "kerrigan-landing: ${IMAGE}:${TAG}@${DIGEST}"
          echo "Image: \`${IMAGE}:${TAG}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
